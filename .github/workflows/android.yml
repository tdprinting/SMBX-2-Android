name: Android Build

on:
  push:
    branches:
      - claude/blissful-ride-7jzzut
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform, build-tools, CMake, NDK)
        run: |
          # Accept licenses non-interactively; yes(1) gets SIGPIPE once sdkmanager exits, hence || true
          (yes || true) | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"

      - name: Install Ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build

      - name: Make Gradle wrapper executable
        working-directory: Engine/android-project
        run: chmod +x ./gradlew

      - name: Build debug APK (arm64-v8a)
        working-directory: Engine/android-project
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK (arm64-v8a)
        working-directory: Engine/android-project
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moondust-android-apks
          path: Engine/android-project/moondust/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
